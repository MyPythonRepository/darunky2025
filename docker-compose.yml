services:
  backend:
#    image: darunky_img
    build: ./
    container_name: darunky_container
    working_dir: /darunky
    ports:
      - "8015:8025"
    command:
      - ./commands/start_server_${MODE}.sh
    volumes:
      - ./src:/darunky/src
      - ./commands:/darunky/commands/
      - static_content:/darunky/src/static
      - media_content:/darunky/src/media
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:17.5
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env

#  pgadmin:
#    image: dpage/pgadmin4
#    container_name: pgadmin_container
#    restart: on-failure
#    env_file:
#      - .env
#    ports:
#      - "5000:80"
#    volumes:
#      - pg_admin:/var/lib/pgadmin
#    depends_on:
#      - postgres

#  mongodb:
#    image: mongo:8.0.10
#    container_name: mongo_db_container
#    ports:
#      - 27017:27017
#    volumes:
#      - mongo_data:/data/db
#    env_file:
#      - .env
#    restart: on-failure
#
#  mongoadmin:
#    image: mongo-express
#    restart: on-failure
#    container_name: mongo_admin_container
#    ports:
#      - 8091:8081
#    env_file:
#      - .env
#    links:
#      - mongodb
#    depends_on:
#      - mongodb

  nginx:
    image: nginx:1.19
    volumes:
      - static_content:/darunky/src/static
      - media_content:/darunky/src/media
      - ./nginx:/etc/nginx/conf.d
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    depends_on:
      - backend

  redis:
    image: redis
    env_file:
      - .env
    restart: on-failure
    depends_on:
      - backend

  redisadmin:
    image: rediscommander/redis-commander:latest
    container_name: redisadmin_container
    restart: always
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  celery:
    build: ./
    container_name: celery-container
    command:
      - ./commands/start_celery.sh
    restart: on-failure
    volumes:
      - ./src:/darunky
      - ./commands:/darunky/commands
    env_file:
      - .env
    depends_on:
      - backend
      - redis

  flower:
    build: ./
    container_name: flower-container
    volumes:
      - ./src:/darunky
    env_file:
      - .env
    command: celery -A config flower --broker=redis://redis
    ports:
      - 5556:5555
    depends_on:
      - celery


volumes:
  pg_data: { }
  pg_admin: { }
  mongo_data: { }
  static_content: { }
  media_content: { }
