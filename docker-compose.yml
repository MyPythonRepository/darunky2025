services:
  backend:
#    image: darunky_img
    build: ./
    container_name: darunky_container
    working_dir: /darunky
    ports:
      - "8015:8025"
    command: ./commands/start_server_dev.sh
    volumes:
      - ./src:/darunky/src
      - ./commands:/darunky/commands/
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:17.5
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env


volumes:
  pg_data: { }
