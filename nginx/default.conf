server {
    listen 80 default_server;
    listen 443 default_server;

    server_name darunky;

    location /static/ {
        alias /darunky/src/static/;
    }

    location /media/ {
        alias /darunky/src/media/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_pass http://backend:8025;

        client_max_body_size 10M;
    }

}
