{% extends "index.html" %}

{% block content %}
<div class="container my-4" style="max-width: 600px;">
    <h2 class="mb-4 text-center">Request for {{ item.name }}</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="text-center">
            <button type="submit" class="btn btn-primary">Send Request</button>
            <a href="{% url 'items:item_detail' item.id %}" class="btn btn-secondary ms-2">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
