{% extends "index.html" %}

{% block content %}
<div class="container my-4" style="max-width: 600px;">
    <h2 class="text-center mb-4">Delete confirmation</h2>
    <p class="text-center">Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>

    <form method="post" class="text-center">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger me-2">Yes, delete</button>
        <a href="{% url 'items:item_detail' object.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
